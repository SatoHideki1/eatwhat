<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天吃什么？</title>
<style>
  :root {
    --accent: #f97316;
    --accent-dark: #ea580c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(135deg, #fff7ed, #ffedd5 45%, #fce7f3);
    color: #1f2937;
  }
  .card {
    width: 100%;
    max-width: 540px;
    background: #ffffff;
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 24px 60px rgba(234, 88, 12, 0.12);
  }
  .card.wide { max-width: 940px; }
  h1 {
    text-align: center;
    font-size: 2.4rem;
    letter-spacing: 0.05em;
    background: linear-gradient(90deg, #f97316, #ef4444);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .subtitle {
    text-align: center;
    color: #9ca3af;
    margin: 10px 0 28px;
    font-size: 0.95rem;
  }
  .banner {
    margin-bottom: 18px;
    padding: 12px 14px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 12px;
    color: #b91c1c;
    font-size: 0.88rem;
    line-height: 1.6;
  }
  .banner code {
    background: #fee2e2;
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 0.85em;
  }

  /* ---------- 登录 / 注册 ---------- */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1;
    padding: 10px;
    border: 2px solid #e5e7eb;
    background: #fff;
    border-radius: 12px;
    font-size: 1rem;
    color: #9ca3af;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .tab.active {
    border-color: var(--accent);
    color: var(--accent-dark);
    font-weight: 600;
    background: #fff7ed;
  }
  #auth-form { display: flex; flex-direction: column; gap: 12px; }
  #auth-form input {
    padding: 12px 16px;
    font-size: 1rem;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #auth-form input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
  }
  .auth-error {
    color: #b91c1c;
    font-size: 0.88rem;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 10px;
    padding: 8px 12px;
  }
  .auth-btn {
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #fb923c, #ef4444);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .auth-btn:active { transform: scale(0.98); }
  .auth-btn:disabled { opacity: 0.6; cursor: wait; }

  /* ---------- 主界面 ---------- */
  .user-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: #9ca3af;
    margin-bottom: 8px;
  }
  .admin-link {
    border: none;
    background: transparent;
    padding: 0;
    color: #b45309;
    font-size: 0.85rem;
    text-decoration: underline;
    cursor: pointer;
  }
  #logout-btn {
    border: none;
    background: transparent;
    color: #ef4444;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .chip-act {
    border: none;
    background: transparent;
    color: #fdba74;
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 50%;
  }
  .chip-act:hover { color: #ea580c; background: #ffedd5; }
  .chip-act.del { color: #f87171; }
  .chip-act.del:hover { color: #dc2626; background: #fee2e2; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(31, 41, 55, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .modal-card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .modal-close {
    border: none;
    background: transparent;
    font-size: 1.1rem;
    color: #9ca3af;
    cursor: pointer;
  }
  .modal-close:hover { color: #ef4444; }
  .account-info { font-size: 0.9rem; color: #6b7280; margin-bottom: 14px; }
  .modal-sub {
    font-size: 0.95rem;
    color: #b45309;
    margin-bottom: 10px;
    font-weight: 700;
  }
  #pw-form { display: flex; flex-direction: column; gap: 10px; }
  #pw-form input {
    padding: 10px 14px;
    font-size: 0.95rem;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #pw-form input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
  }
  .pw-msg { font-size: 0.85rem; border-radius: 8px; padding: 6px 10px; }
  .pw-msg.err { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; }
  .pw-msg.ok { color: #15803d; background: #f0fdf4; border: 1px solid #bbf7d0; }
  .admin-link {
    color: #b45309;
    font-size: 0.85rem;
    text-decoration: underline;
  }
  .app-grid {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 20px;
    align-items: start;
    margin-top: 22px;
  }
  .panel {
    background: #fffaf3;
    border: 1px solid #ffedd5;
    border-radius: 18px;
    padding: 18px;
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .panel-title {
    font-size: 1.02rem;
    font-weight: 700;
    color: #b45309;
  }
  .panel .hint { margin: 12px 0; }
  .select-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .mode-btn {
    border: 2px solid #e5e7eb;
    background: #fff;
    color: #9ca3af;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .mode-btn.on {
    border-color: var(--accent);
    background: #fff7ed;
    color: var(--accent-dark);
    font-weight: 600;
  }
  .chip.selectable { cursor: pointer; }
  .chip.picked {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chip.picked .by { color: #ffedd5; opacity: 1; }
  .add-row { display: flex; gap: 10px; }
  .input-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
  }
  #dish-input {
    flex: 1;
    min-width: 0;
    padding: 12px 16px;
    font-size: 1rem;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #dish-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
  }
  .add-btn {
    padding: 12px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.1s;
  }
  .want-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 0.95rem;
    color: #9a3412;
  }
  #want-count {
    width: 64px;
    padding: 8px;
    font-size: 1rem;
    text-align: center;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #want-count:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
  }
  .add-btn:hover { background: var(--accent-dark); }
  .add-btn:active { transform: scale(0.96); }

  .suggest {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    max-height: 224px;
    overflow: hidden auto;
    background: #fff;
    border: 1px solid #fed7aa;
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(234, 88, 12, 0.15);
    z-index: 20;
  }
  .suggest-item {
    padding: 10px 14px;
    font-size: 0.95rem;
    color: #7c2d12;
    cursor: pointer;
  }
  .suggest-item:hover { background: #fff7ed; }

  .count-label {
    color: #9ca3af;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  .hint {
    text-align: center;
    color: #d1d5db;
    margin: 24px 0;
    font-size: 0.9rem;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-content: flex-start;
    min-height: 120px;
    max-height: 360px;
    overflow-y: auto;
    padding: 2px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 999px;
    color: #9a3412;
    font-size: 0.95rem;
    animation: chip-in 0.25s ease;
  }
  @keyframes chip-in {
    from { opacity: 0; transform: scale(0.8); }
    to   { opacity: 1; transform: scale(1); }
  }
  .chip .by {
    font-size: 0.72rem;
    color: #d97706;
    opacity: 0.85;
    white-space: nowrap;
  }
  .chip.flash {
    border-color: var(--accent);
    animation: flash 0.9s ease 2;
  }
  @keyframes flash {
    0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
    40%      { box-shadow: 0 0 0 6px rgba(249, 115, 22, 0.35); }
  }

  .pick-btn {
    width: 100%;
    margin-top: 14px;
    padding: 16px;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    border: none;
    border-radius: 999px;
    background: linear-gradient(90deg, #fb923c, #ef4444);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(239, 68, 68, 0.25);
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
  }
  .pick-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(239, 68, 68, 0.3);
  }
  .pick-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .result {
    margin-top: 14px;
    text-align: center;
    padding: 20px;
    border-radius: 16px;
    background: #fff7ed;
    border: 1px dashed #fdba74;
  }
  .result-label {
    font-size: 0.95rem;
    color: #b45309;
    margin-bottom: 6px;
  }
  .result-name {
    font-size: 2rem;
    font-weight: 700;
    color: #ea580c;
  }
  .result.pop { animation: pop 0.4s ease; }
  @keyframes pop {
    0%   { transform: scale(0.9); }
    60%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .footer {
    margin-top: 16px;
    text-align: center;
    font-size: 0.75rem;
    color: #d1d5db;
  }

  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
  }

  @media (max-width: 760px) {
    .app-grid { grid-template-columns: 1fr; }
    .action-panel { order: -1; }
    .chips { max-height: 240px; }
  }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>
<main class="card" id="card">
  <div id="offline-banner" class="banner" hidden>
    ⚠️ 连不上共享服务器。请确认服务已启动：服务器上运行 <code>sudo systemctl start eatwhat</code>
  </div>

  <p class="hint" id="boot-loading">加载中…</p>

  <!-- 登录 / 注册 -->
  <section id="auth-view" hidden>
    <h1>今天吃什么？</h1>
    <p class="subtitle">注册个名字，和大家一起决定今天吃什么 🍜</p>

    <div class="tabs">
      <button type="button" id="tab-login" class="tab active">登录</button>
      <button type="button" id="tab-register" class="tab">注册</button>
    </div>
    <p class="hint" id="reg-closed-note" hidden style="margin: -10px 0 16px;">注册已关闭，仅限已注册用户登录</p>
    <form id="auth-form">
      <input id="auth-username" type="text" placeholder="用户名" autocomplete="username" maxlength="20" />
      <input id="auth-password" type="password" placeholder="密码（至少 4 位）" autocomplete="current-password" maxlength="64" />
      <div id="auth-error" class="auth-error" hidden></div>
      <button type="submit" id="auth-submit" class="auth-btn">登录</button>
    </form>
  </section>

  <!-- 主界面 -->
  <section id="app-view" hidden>
    <div class="user-bar">你好，<b id="me-name"></b><button type="button" id="account-link" class="admin-link" hidden>账户设置</button><a id="admin-link" class="admin-link" href="/admin" hidden>后台管理</a><button type="button" id="logout-btn">退出</button></div>
    <h1>今天吃什么？</h1>
    <p class="subtitle">是啊，吃什么？</p>

    <div class="app-grid">
      <!-- 左栏：备选菜名 -->
      <section class="panel dish-panel">
        <div class="panel-head">
          <h2 class="panel-title">备选菜名</h2>
          <span id="count-label" class="count-label"></span>
        </div>
        <div class="select-bar">
          <button type="button" id="select-mode-btn" class="mode-btn" aria-pressed="false">自选范围</button>
          <span id="select-hint" class="count-label" hidden>点击菜名勾选，抽选将只在勾选范围内进行</span>
        </div>
        <p class="hint" id="empty">还没有菜名，第一个加进来吧～</p>
        <div id="chips" class="chips"></div>
      </section>

      <!-- 右栏：输入菜名 -->
      <section class="panel action-panel">
        <div class="panel-head">
          <h2 class="panel-title">输入菜名</h2>
        </div>
        <form id="add-form" class="add-row">
          <div class="input-wrap">
            <input id="dish-input" type="text" placeholder="如：红烧肉（逗号分隔可批量）" autocomplete="off" />
            <div id="suggest" class="suggest" hidden></div>
          </div>
          <button type="submit" class="add-btn">添加/搜索</button>
        </form>

        <div class="want-row">
          <span>要</span>
          <input id="want-count" type="text" inputmode="numeric" value="1" maxlength="3" autocomplete="off" aria-label="要几道菜" />
          <span>道菜</span>
        </div>

        <button id="pick-btn" class="pick-btn" type="button" disabled>🎲 开始选菜</button>

        <div id="result" class="result" hidden>
          <div class="result-label" id="result-label"></div>
          <div class="result-name" id="result-name"></div>
        </div>
      </section>
    </div>

    <p class="footer">菜名保存在共享服务器上，大家的改动每 5 秒自动同步</p>
  </section>
</main>

<div id="rename-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="panel-title">修改菜名</h2>
      <button type="button" id="rename-close" class="modal-close" aria-label="关闭">✕</button>
    </div>
    <form id="rename-form">
      <input id="rename-input" type="text" maxlength="50" autocomplete="off" aria-label="新菜名" />
      <p id="rename-msg" class="pw-msg" hidden></p>
      <button type="submit" class="auth-btn">保存</button>
    </form>
  </div>
</div>

<div id="account-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="panel-title">账户设置</h2>
      <button type="button" id="account-close" class="modal-close" aria-label="关闭">✕</button>
    </div>
    <p class="account-info">用户名：<b id="account-name"></b><span id="account-created"></span></p>
    <h3 class="modal-sub">修改密码</h3>
    <form id="pw-form">
      <input id="pw-old" type="password" placeholder="当前密码" autocomplete="current-password" maxlength="64" />
      <input id="pw-new" type="password" placeholder="新密码（至少 4 位）" autocomplete="new-password" maxlength="64" />
      <input id="pw-new2" type="password" placeholder="再输入一次新密码" autocomplete="new-password" maxlength="64" />
      <p id="pw-msg" class="pw-msg" hidden></p>
      <button type="submit" class="auth-btn">保存新密码</button>
    </form>
  </div>
</div>

<script>
  const API = '/api/dishes';
  const $ = id => document.getElementById(id);
  const banner = $('offline-banner');

  /* ---------- 登录 / 注册 ---------- */
  const authView = $('auth-view');
  const appView = $('app-view');
  const card = $('card');
  const regClosedNote = $('reg-closed-note');
  const bootLoading = $('boot-loading');
  let regOpen = true;

  function applyRegOpen() {
    tabRegister.hidden = !regOpen;
    regClosedNote.hidden = regOpen;
    if (!regOpen && authMode === 'register') setAuthMode('login');
  }
  const tabLogin = $('tab-login');
  const tabRegister = $('tab-register');
  const authForm = $('auth-form');
  const authUsername = $('auth-username');
  const authPassword = $('auth-password');
  const authError = $('auth-error');
  const authSubmit = $('auth-submit');
  const meName = $('me-name');
  const logoutBtn = $('logout-btn');

  let authMode = 'login';
  let me = null;

  const adminLink = $('admin-link');
  const accountLink = $('account-link');
  const accountModal = $('account-modal');
  const accountName = $('account-name');
  const accountCreated = $('account-created');
  const pwForm = $('pw-form');
  const pwOld = $('pw-old');
  const pwNew = $('pw-new');
  const pwNew2 = $('pw-new2');
  const pwMsg = $('pw-msg');
  let meCreated = null;

  function setMe(name, role) {
    bootLoading.hidden = true;  // 登录状态已确认，撤掉过渡提示
    me = name || null;
    authView.hidden = !!me;
    appView.hidden = !me;
    card.classList.toggle('wide', !!me);  // 主界面用宽卡片（两栏），登录页用窄卡片
    accountLink.hidden = !me;
    adminLink.hidden = role !== 'admin';  // 仅管理员可见后台入口
    if (!me) accountModal.hidden = true;  // 登出时若弹窗开着则一并关闭
    if (me) {
      meName.textContent = me;
      refresh();
    }
  }

  function showAuthError(msg) {
    authError.textContent = msg;
    authError.hidden = false;
  }

  function setAuthMode(mode) {
    authMode = mode;
    tabLogin.classList.toggle('active', mode === 'login');
    tabRegister.classList.toggle('active', mode === 'register');
    authSubmit.textContent = mode === 'login' ? '登录' : '注册并登录';
    authPassword.setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
    authError.hidden = true;
  }

  tabLogin.addEventListener('click', () => setAuthMode('login'));
  tabRegister.addEventListener('click', () => setAuthMode('register'));

  authForm.addEventListener('submit', async e => {
    e.preventDefault();
    const username = authUsername.value.trim();
    const password = authPassword.value;
    if (!username || !password) { showAuthError('请输入用户名和密码'); return; }
    authSubmit.disabled = true;
    try {
      const res = await fetch('/api/' + authMode, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showAuthError(data.error || '出错了，请重试');
        return;
      }
      authUsername.value = '';
      authPassword.value = '';
      authError.hidden = true;
      setMe(data.user, data.role);
    } catch {
      showAuthError('连不上服务器，请稍后再试');
    } finally {
      authSubmit.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', async () => {
    try { await fetch('/api/logout', { method: 'POST' }); } catch {}
    try {  // 退出后重新拉取注册开关状态
      const data = await api('/api/me');
      regOpen = data.registrationOpen !== false;
      applyRegOpen();
    } catch {}
    setMe(null);
  });

  /* ---------- 菜名主界面 ---------- */
  const input = $('dish-input');
  const suggestEl = $('suggest');
  const addForm = $('add-form');
  const countLabel = $('count-label');
  const chipsEl = $('chips');
  const emptyEl = $('empty');
  const pickBtn = $('pick-btn');
  const wantInput = $('want-count');
  const modeBtn = $('select-mode-btn');
  const selectHint = $('select-hint');
  const resultEl = $('result');
  const resultLabel = $('result-label');
  const resultName = $('result-name');

  let dishes = [];   // 服务器上的共享菜名（本页的镜像），每项 {name, by, at}
  let rev = -1;      // 服务器数据的版本号，用于轮询时判断是否有更新
  let picking = false;
  let selectMode = false;      // 自选范围：开启后只在勾选的菜里抽取
  let selected = new Set();    // 勾选的菜名

  async function api(path, options = {}) {
    const res = await fetch(path, options);
    if (res.status === 401) {
      setMe(null);
      throw new Error('unauthorized');
    }
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j && j.error) msg = j.error; } catch {}
      throw new Error(msg);
    }
    return res.json();
  }

  function isAuthError(err) {
    return err && err.message === 'unauthorized';
  }

  async function refresh() {
    if (!me) return;
    try {
      const data = await api(API);
      banner.hidden = true;
      if (data.rev !== rev) {
        rev = data.rev;
        dishes = data.dishes;
        render();
      }
    } catch (err) {
      if (!isAuthError(err)) banner.hidden = false;
    }
  }

  function render() {
    chipsEl.innerHTML = '';
    dishes.forEach(dish => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      if (dish.at) {
        chip.title = `由 ${dish.by || '早期数据'} 添加于 ${new Date(dish.at * 1000).toLocaleString('zh-CN')}`;
      }
      const name = document.createElement('span');
      name.className = 'dish';
      name.textContent = (selectMode && selected.has(dish.name) ? '✓ ' : '') + dish.name;
      const by = document.createElement('span');
      by.className = 'by';
      by.textContent = dish.by ? '· ' + dish.by : '';
      chip.append(name, by);
      // 自选范围模式下：点击菜名勾选/取消勾选
      if (selectMode) {
        chip.classList.add('selectable');
        if (selected.has(dish.name)) chip.classList.add('picked');
        chip.addEventListener('click', e => {
          if (e.target.closest('button')) return;  // ✎/× 按钮不触发勾选
          if (selected.has(dish.name)) selected.delete(dish.name);
          else selected.add(dish.name);
          render();
        });
      }
      // 自己添加的菜：提供重命名 / 删除
      if (me && dish.by === me) {
        const ren = document.createElement('button');
        ren.type = 'button';
        ren.className = 'chip-act';
        ren.textContent = '✎';
        ren.setAttribute('aria-label', '重命名' + dish.name);
        ren.addEventListener('click', () => renameDish(dish));
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'chip-act del';
        del.textContent = '×';
        del.setAttribute('aria-label', '删除' + dish.name);
        del.addEventListener('click', () => deleteDish(dish));
        chip.append(ren, del);
      }
      chipsEl.appendChild(chip);
    });

    const has = dishes.length > 0;
    emptyEl.hidden = has;
    pickBtn.disabled = !has || picking || (selectMode && selected.size === 0);
    countLabel.textContent = selectMode
      ? `已选 ${selected.size} / 共 ${dishes.length} 道菜`
      : `共 ${dishes.length} 道菜`;
    selectHint.hidden = !(selectMode && has && selected.size === 0);
    modeBtn.classList.toggle('on', selectMode);
    modeBtn.setAttribute('aria-pressed', String(selectMode));
    modeBtn.textContent = selectMode ? '✓ 自选范围中' : '自选范围';
  }

  function flashChip(name) {
    const chip = [...chipsEl.querySelectorAll('.chip')].find(
      c => c.querySelector('.dish').textContent === name
    );
    if (!chip) return;
    chip.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    chip.classList.remove('flash');
    void chip.offsetWidth;
    chip.classList.add('flash');
  }

  /* 修改 / 删除自己创建的菜品 */
  let renameFrom = null;
  const renameModal = $('rename-modal');
  const renameInput = $('rename-input');
  const renameMsg = $('rename-msg');
  const renameForm = $('rename-form');

  function renameDish(dish) {
    renameFrom = dish.name;
    renameInput.value = dish.name;
    renameMsg.hidden = true;
    renameModal.hidden = false;
    renameInput.focus();
    renameInput.select();
  }

  async function deleteDish(dish) {
    if (!confirm(`删除「${dish.name}」？`)) return;
    try {
      const data = await api(API + '/' + encodeURIComponent(dish.name), { method: 'DELETE' });
      banner.hidden = true;
      rev = data.rev;
      dishes = data.dishes;
      render();
    } catch (err) {
      if (!isAuthError(err)) { banner.hidden = false; alert(err.message); }
    }
  }

  function post(names) {
    return api(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ names }),
    });
  }

  addForm.addEventListener('submit', async e => {
    e.preventDefault();
    const names = input.value.split(/[,，、\n]+/).map(s => s.trim()).filter(Boolean);
    if (names.length === 0) { shake(input); return; }
    try {
      const data = await post(names);
      banner.hidden = true;
      rev = data.rev;
      dishes = data.dishes;
      input.value = '';
      hideSuggest();
      render();
      if (data.added.length === 0) flashChip(names[0]);
      input.focus();
    } catch (err) {
      if (!isAuthError(err)) banner.hidden = false;
    }
  });

  /* 要几道菜：只接受数字，范围 1 ~ 菜名总数 */
  wantInput.addEventListener('input', () => {
    const clean = wantInput.value.replace(/\D/g, '');
    if (wantInput.value !== clean) wantInput.value = clean;
  });

  /* 自选范围开关 */
  modeBtn.addEventListener('click', () => {
    selectMode = !selectMode;
    if (!selectMode) selected.clear();  // 关闭时清空勾选
    render();
  });

  function pickCount(limit) {
    const n = parseInt(wantInput.value, 10);
    if (isNaN(n) || n < 1) return 1;
    return Math.min(n, limit);  // 要得比范围内菜名多时，有几道出几道
  }

  function sampleDishes(pool, count) {
    const shuffled = [...pool];
    for (let i = shuffled.length - 1; i > 0; i--) {  // Fisher-Yates 洗牌
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, count);
  }

  pickBtn.addEventListener('click', () => {
    // 自选范围开启且已勾选时，只从勾选的菜里抽
    const pool = selectMode && selected.size > 0
      ? dishes.filter(d => selected.has(d.name))
      : dishes;
    if (picking || pool.length === 0) return;
    const count = pickCount(pool.length);
    picking = true;
    pickBtn.disabled = true;
    pickBtn.textContent = '🎯 正在挑选…';
    resultEl.hidden = false;
    resultLabel.textContent = count > 1 ? `正在为你挑选 ${count} 道…` : '正在为你挑选…';
    const rounds = 22;
    let i = 0;
    const timer = setInterval(() => {
      resultName.textContent = pool[Math.floor(Math.random() * pool.length)].name;
      if (++i >= rounds) {
        clearInterval(timer);
        const winners = sampleDishes(pool, count);
        resultName.textContent = winners.map(d => d.name).join('、');
        resultLabel.textContent = selectMode
          ? (count > 1 ? `从你选的 ${pool.length} 道里挑了 ${winners.length} 道` : '从你选的菜里挑中了')
          : (count > 1 ? `今天吃这 ${winners.length} 道` : '今天吃');
        resultEl.classList.remove('pop');
        void resultEl.offsetWidth;
        resultEl.classList.add('pop');
        picking = false;
        pickBtn.textContent = '🎲 再来一次';
        pickBtn.disabled = pool.length === 0;
      }
    }, 70);
  });

  /* 账户设置弹窗：修改密码 */
  function showPwMsg(text, ok) {
    pwMsg.textContent = text;
    pwMsg.className = 'pw-msg ' + (ok ? 'ok' : 'err');
    pwMsg.hidden = false;
  }

  accountLink.addEventListener('click', () => {
    accountName.textContent = me;
    accountCreated.textContent = meCreated
      ? `（注册于 ${new Date(meCreated * 1000).toLocaleDateString('zh-CN')}）`
      : '';
    pwForm.reset();
    pwMsg.hidden = true;
    accountModal.hidden = false;
    pwOld.focus();
  });

  $('account-close').addEventListener('click', () => { accountModal.hidden = true; });
  accountModal.addEventListener('click', e => {
    if (e.target === accountModal) accountModal.hidden = true;  // 点遮罩关闭
  });

  $('rename-close').addEventListener('click', () => { renameModal.hidden = true; });
  renameModal.addEventListener('click', e => {
    if (e.target === renameModal) renameModal.hidden = true;
  });

  renameForm.addEventListener('submit', async e => {
    e.preventDefault();
    const to = renameInput.value.trim();
    if (!to) { renameMsg.textContent = '菜名不能为空'; renameMsg.className = 'pw-msg err'; renameMsg.hidden = false; return; }
    if (to === renameFrom) { renameModal.hidden = true; return; }
    try {
      const data = await api('/api/dishes/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from: renameFrom, to }),
      });
      banner.hidden = true;
      rev = data.rev;
      dishes = data.dishes;
      renameModal.hidden = true;
      render();
      flashChip(to);
    } catch (err) {
      if (isAuthError(err)) return;
      renameMsg.textContent = err.message;
      renameMsg.className = 'pw-msg err';
      renameMsg.hidden = false;
    }
  });

  pwForm.addEventListener('submit', async e => {
    e.preventDefault();
    const oldPw = pwOld.value;
    const newPw = pwNew.value;
    if (!oldPw || !newPw) { showPwMsg('请填写当前密码和新密码', false); return; }
    if (newPw !== pwNew2.value) { showPwMsg('两次输入的新密码不一致', false); return; }
    if (newPw.length < 4) { showPwMsg('新密码至少 4 位', false); return; }
    try {
      await api('/api/password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oldPassword: oldPw, newPassword: newPw }),
      });
      banner.hidden = true;
      showPwMsg('密码已修改', true);
      pwForm.reset();
    } catch (err) {
      if (isAuthError(err)) return;
      showPwMsg(err.message, false);
    }
  });

  /* 搜索建议：输入时列出已有的近似菜名，点击直接选用 */
  function hideSuggest() { suggestEl.hidden = true; }

  function buildSuggest() {
    const q = input.value.trim().toLowerCase();
    const matches = q ? dishes.filter(d => d.name.toLowerCase().includes(q)).slice(0, 8) : [];
    suggestEl.innerHTML = '';
    if (matches.length === 0) { hideSuggest(); return; }
    matches.forEach(m => {
      const item = document.createElement('div');
      item.className = 'suggest-item';
      item.textContent = m.name;
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        input.value = m.name;
        hideSuggest();
        if (addForm.requestSubmit) addForm.requestSubmit();
        else addForm.dispatchEvent(new Event('submit', { cancelable: true }));
      });
      suggestEl.appendChild(item);
    });
    suggestEl.hidden = false;
  }

  input.addEventListener('input', buildSuggest);
  input.addEventListener('focus', buildSuggest);
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.input-wrap')) hideSuggest();
  });

  function shake(el) {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }

  setInterval(refresh, 5000);
  window.addEventListener('focus', refresh);
  render();

  /* 启动：查询登录状态，决定显示登录页还是主界面 */
  (async function init() {
    try {
      const data = await api('/api/me');
      regOpen = data.registrationOpen !== false;
      applyRegOpen();
      meCreated = data.created || null;
      setMe(data.user, data.role);
    } catch {
      setMe(null);
      banner.hidden = false;
    }
  })();
</script>
</body>
</html>
